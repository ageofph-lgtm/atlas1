<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>ATLAS — Oficina Inteligente</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('atlas-theme') || 'still-dark';
          if (!['still-light', 'still-dark', 'retro-light', 'retro-dark'].includes(t)) t = 'still-dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'still-dark';
        }
      })();
    </script>
    <!--
      Arranque vigiado. Corre antes do código da aplicação, porque é justamente
      quando esse código não chega que é preciso agir.

      Medido em browser: depois de publicar, um index.html velho guardado pelo
      browser pede um /assets/index-<hash>.js que já não existe — 404 — e a
      página fica em branco, "a carregar" para sempre. Aqui:
        - se um ficheiro de /assets/ falha antes de a aplicação arrancar, limpa
          o service worker e as caches e reabre por um endereço novo (o que o
          Ctrl+Shift+R fazia à mão) — uma vez a cada 5 minutos, nunca em ciclo;
        - se já se tentou, ou se ao fim de 25 s nada arrancou, mostra um ecrã
          com um botão que faz o mesmo, em vez do círculo eterno.
      A sessão fica: o localStorage não se toca.
    -->
    <script>
      (function () {
        var CHAVE = 'atlas:arranque-recuperado';
        var MARCA = '_v';
        var ESPERA = 25000;
        var JANELA = 5 * 60 * 1000;

        // O marcador de "sem cache" já fez o seu trabalho ao abrir: sai do endereço.
        try {
          var u = new URL(location.href);
          if (u.searchParams.has(MARCA)) {
            u.searchParams.delete(MARCA);
            history.replaceState(history.state, '', u.pathname + u.search + u.hash);
          }
        } catch (e) {}

        function arrancou() { return !!window.__atlasArrancou; }
        // Tentou há menos de 5 minutos: limpar outra vez não resolveria, e dava um ciclo.
        function jaTentou() {
          try { return Date.now() - Number(sessionStorage.getItem(CHAVE) || 0) < JANELA; } catch (e) { return true; }
        }

        function limparEAbrir() {
          try { sessionStorage.setItem(CHAVE, String(Date.now())); } catch (e) {}
          var tarefas = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              tarefas.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).catch(function () {}));
            }
            if (window.caches && caches.keys) {
              tarefas.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches['delete'](k); }));
              }).catch(function () {}));
            }
          } catch (e) {}
          var foi = false;
          function abrir() {
            if (foi) return;
            foi = true;
            var sep = location.search ? '&' : '?';
            location.replace(location.pathname + location.search + sep + MARCA + '=' + Date.now() + location.hash);
          }
          Promise.all(tarefas).then(abrir, abrir);
          setTimeout(abrir, 3000);
        }

        function mostrarEcra(titulo, texto) {
          if (arrancou() || document.getElementById('arranque-vigiado')) return;
          var caixa = document.createElement('div');
          caixa.id = 'arranque-vigiado';
          caixa.setAttribute('role', 'alert');
          caixa.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;text-align:center';
          caixa.innerHTML =
            '<div style="max-width:360px">' +
            '<p style="font-size:18px;font-weight:700;margin:0 0 8px">' + titulo + '</p>' +
            '<p style="font-size:14px;line-height:1.5;color:#94a3b8;margin:0 0 20px">' + texto + '</p>' +
            '<button type="button" style="font:inherit;font-size:15px;font-weight:700;padding:12px 20px;border:0;border-radius:10px;background:#f59e0b;color:#0f172a;cursor:pointer">Limpar e abrir de novo</button>' +
            '<p style="font-size:12px;color:#64748b;margin:14px 0 0">A sessão não se perde.</p>' +
            '</div>';
          caixa.querySelector('button').onclick = limparEAbrir;
          (document.body || document.documentElement).appendChild(caixa);
        }

        function falhou() {
          if (arrancou()) return;
          if (!jaTentou()) { limparEAbrir(); return; }
          var mostrar = function () {
            mostrarEcra('O ATLAS não conseguiu abrir', 'Ficou guardada neste computador uma versão antiga da aplicação. Carregue no botão para a limpar e abrir a versão atual.');
          };
          if (document.body) mostrar(); else document.addEventListener('DOMContentLoaded', mostrar);
        }

        // Um ficheiro da aplicação que não carregou (404, ou HTML no lugar de JS).
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (!el || el === window || arrancou()) return;
          var endereco = el.src || el.href || '';
          if ((el.tagName === 'SCRIPT' || el.tagName === 'LINK') && endereco.indexOf('/assets/') !== -1) falhou();
        }, true);

        setTimeout(function () {
          mostrarEcra('O ATLAS está a demorar a abrir', 'Pode ser a rede. Se continuar assim, carregue no botão para limpar a versão guardada neste computador e abrir a atual.');
        }, ESPERA);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
